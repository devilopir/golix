server {
  listen 80;
  root /usr/share/nginx/html;
  # Behind the proxy, a redirect must keep the visitor's scheme and host.
  absolute_redirect off;
  error_page 404 /404.html;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location = /headless {
    return 301 /headless/;
  }

  location /headless/ {
    try_files $uri $uri/index.html =404;
  }

  location = /docs {
    return 301 /docs/;
  }

  location /docs/ {
    try_files $uri $uri/index.html =404;
  }

  # The shared proxy sends only the lobby's paths to golix-server, so connection reports come through here.
  # X-Forwarded-For stays the proxy's own, whose last hop is the address that reached it, as the server expects.
  location = /token {
    resolver 127.0.0.11 valid=30s;
    set $lobby http://golix-server:8787;
    proxy_pass $lobby;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  location = /headlesstoken {
    return 301 /headlesstoken/;
  }

  location /headlesstoken/ {
    try_files $uri $uri/index.html =404;
  }

  location = /telemetry {
    # Resolved per request through Docker's DNS, so the site still starts while the server container is down.
    resolver 127.0.0.11 valid=30s;
    set $lobby http://golix-server:8787;
    proxy_pass $lobby;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
  }

  # The game answers only at these addresses; anything else is a real 404, not the game under a wrong URL.
  location = / {
    try_files /index.html =404;
  }

  location = /play {
    try_files /index.html =404;
  }

  location = /replay {
    try_files /index.html =404;
  }

  location / {
    try_files $uri =404;
  }
}
