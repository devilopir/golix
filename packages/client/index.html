<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Golix: Free Online Multiplayer Football Game</title>
    <meta name="description" content="Play physics-based 2D football with friends in your browser. Create a room, share the link and play, with no download and no account." />
    <link rel="canonical" href="https://golix.cosmosfutsal.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Golix" />
    <meta property="og:title" content="Golix: Free Online Multiplayer Football Game" />
    <meta property="og:description" content="Play physics-based 2D football with friends in your browser. Create a room, share the link and play." />
    <meta property="og:url" content="https://golix.cosmosfutsal.com/" />
    <meta property="og:image" content="https://golix.cosmosfutsal.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Golix logo" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "Golix", "url": "https://golix.cosmosfutsal.com/" }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Golix",
        "url": "https://golix.cosmosfutsal.com/",
        "description": "Physics-based 2D multiplayer football that runs in the browser. Players host rooms and others join by link.",
        "image": "https://golix.cosmosfutsal.com/icon-512.png",
        "genre": ["Sports", "Football"],
        "playMode": "MultiPlayer",
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#161a1e" />
  </head>
  <body>
    <div id="app"></div>
    <footer class="dk-site-links">
      <a href="/docs/">For developers</a>
      <a href="/headless/">Host a bot room</a>
      <a href="https://www.npmjs.com/package/golix.js" target="_blank" rel="noopener">golix.js on npm</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
